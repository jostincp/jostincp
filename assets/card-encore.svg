<text x="44" y="118" font-size="52" font-weight="800" fill="#f8fafc">Encore</text>
<text x="44" y="160" font-size="19" fill="#cbd5e1">Digital jukebox, 3D menus and loyalty points for bars and restaurants.</text>
<text x="44" y="190" font-size="17" fill="#94a3b8">Real-time song queue over WebSockets, powered by Node.js microservices.</text>
