<g class="f2"><polygon points="1100,210 1117.32,220.0 1100,230 1082.68,220.0" fill="#fcd570"/><polygon points="1082.68,220.0 1100,230 1100,250 1082.68,240.0" fill="#fbbf24"/><polygon points="1100,230 1117.32,220.0 1117.32,240.0 1100,250" fill="#8a6913"/><polyline points="1082.68,220.0 1100,230 1117.32,220.0" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/><line x1="1100" y1="230" x2="1100" y2="250" stroke="#ffffff" stroke-opacity="0.2"/></g>
