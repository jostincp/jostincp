<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Encore - digital jukebox, 3D menus and loyalty points for bars and restaurants">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1228"/><stop offset="1" stop-color="#0a0e1f"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<radialGradient id="rg"><stop offset="0" stop-color="#f472b6" stop-opacity=".35"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".06"/></pattern>
<clipPath id="cl"><rect width="1200" height="330" rx="18"/></clipPath>
</defs><style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono,.mono text{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace}
.run{animation:run 6s linear infinite}
@keyframes run{to{stroke-dashoffset:-3052}}
.f1{animation:f 4s ease-in-out infinite alternate}
.f2{animation:f 3s ease-in-out infinite alternate-reverse}
.f3{animation:f 5s ease-in-out infinite alternate}
@keyframes f{to{transform:translateY(-10px)}}
.sh{animation:sh 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes sh{to{transform:scale(.8);opacity:.5}}
.orb{animation:orb 8s linear infinite;transform-box:view-box;transform-origin:OX OY}
@keyframes orb{to{transform:rotate(360deg)}}
.pulse{animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{opacity:.3}}
.note{animation:note 4s ease-in infinite;opacity:0}
.n2{animation-delay:1.3s}.n3{animation-delay:2.6s}
@keyframes note{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}
.glow{animation:gl 5s ease-in-out infinite alternate}
@keyframes gl{to{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.note{opacity:1}}
</style>
<g clip-path="url(#cl)"><rect width="1200" height="330" fill="url(#bg)"/><rect width="1200" height="330" fill="url(#dots)"/>
<ellipse class="glow" cx="1050" cy="165.0" rx="210" ry="160" fill="url(#rg)"/>
<text x="44" y="56" font-size="13" letter-spacing="2.5" fill="#f472b6" class="mono">★ FLAGSHIP PROJECT</text>
<rect x="250" y="38" width="172" height="26" rx="13" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".5"/>
