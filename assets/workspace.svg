<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 240 84" shape-rendering="crispEdges" role="img" aria-label="Original pixel-art scene: a developer coding at night in Bogota, with a window to the mountains, a weight rack and a sleeping cat">
