<style>
.code{animation:scroll 12s steps(16) infinite}
@keyframes scroll{to{transform:translateY(-48px)}}
.tw{animation:tw 3s steps(1) infinite} .tw1{animation-delay:.7s} .tw2{animation-delay:1.5s} .tw3{animation-delay:2.2s}
@keyframes tw{50%{opacity:.2}}
.blinkred{animation:tw 1.6s steps(1) infinite}
.blink{animation:tw 1.2s steps(1) infinite}
.flk1{animation:tw 5s steps(1) infinite} .flk2{animation:tw 7s steps(1) infinite 2s}
.cloud{animation:cloud 40s linear infinite}
@keyframes cloud{from{transform:translateX(0)}to{transform:translateX(90px)}}
.handA{animation:hA .5s steps(1) infinite} .handB{animation:hB .5s steps(1) infinite}
@keyframes hA{50%{opacity:0}} @keyframes hB{0%{opacity:0}50%{opacity:1}}
.tailA{animation:hA 2.4s steps(1) infinite} .tailB{animation:hB 2.4s steps(1) infinite}
.steam{animation:steam 2.4s steps(4) infinite} .s2{animation-delay:1.2s}
@keyframes steam{0%{transform:translateY(2px);opacity:0}25%{opacity:1}100%{transform:translateY(-4px);opacity:0}}
.zz{animation:zz 3s steps(3) infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,2px)}30%{opacity:1}100%{opacity:0;transform:translate(2px,-3px)}}
.led{animation:led 6s linear infinite}
@keyframes led{0%{fill:#7c3aed}33%{fill:#14b8a6}66%{fill:#ec4899}100%{fill:#7c3aed}}
.glow{animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.6}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.handB,.tailB{opacity:0}}
</style>
