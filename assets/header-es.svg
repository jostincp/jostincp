<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jostin Castillo - Ingeniero de software, tecnología para contact centers, automatización e IA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="0.55" stop-color="#171247"/>
      <stop offset="1" stop-color="#0b3a4d"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono, .mono text { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }
    .blob1 { animation: drift1 14s ease-in-out infinite alternate; }
    .blob2 { animation: drift2 18s ease-in-out infinite alternate; }
    .blob3 { animation: drift3 16s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(180px, 40px); } }
    @keyframes drift2 { to { transform: translate(-220px, -30px); } }
    @keyframes drift3 { to { transform: translate(120px, -60px); } }
    .hello { opacity: 0; animation: rise 1s 0.2s ease-out forwards; }
    .name  { opacity: 0; animation: rise 1s 0.45s ease-out forwards; }
    .chips { opacity: 0; animation: rise 1s 1s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .l1 { animation: s1 12s infinite; }
    .l2 { animation: s2 12s infinite; }
    .l3 { animation: s3 12s infinite; }
    .t1 { animation: ty1 12s infinite; }
    .t2 { animation: ty2 12s infinite; }
    .t3 { animation: ty3 12s infinite; }
    .c1 { animation: cu1 12s infinite, blink .9s steps(1) infinite; }
    .c2 { animation: cu2 12s infinite, blink .9s steps(1) infinite; }
    .c3 { animation: cu3 12s infinite, blink .9s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    /* line visibility slots: 0-33, 33-66, 66-100 */
    @keyframes s1 { 0%{opacity:1} 30%{opacity:1} 32%{opacity:0} 100%{opacity:0} }
    @keyframes s2 { 0%{opacity:0} 33%{opacity:0} 34%{opacity:1} 63%{opacity:1} 65%{opacity:0} 100%{opacity:0} }
    @keyframes s3 { 0%{opacity:0} 66%{opacity:0} 67%{opacity:1} 96%{opacity:1} 98%{opacity:0} 100%{opacity:0} }
    /* typing via clip (stepped) */
    @keyframes ty1 { 0%{clip-path:inset(0 100% 0 0)} 9%{clip-path:inset(0 0 0 0)} 100%{clip-path:inset(0 0 0 0)} }
    @keyframes ty2 { 0%,33%{clip-path:inset(0 100% 0 0)} 42%{clip-path:inset(0 0 0 0)} 100%{clip-path:inset(0 0 0 0)} }
    @keyframes ty3 { 0%,66%{clip-path:inset(0 100% 0 0)} 75%{clip-path:inset(0 0 0 0)} 100%{clip-path:inset(0 0 0 0)} }
    @keyframes cu1 { 0%{transform:translateX(0)} 9%,100%{transform:translateX(486px)} }
    @keyframes cu2 { 0%,33%{transform:translateX(0)} 42%,100%{transform:translateX(470px)} }
    @keyframes cu3 { 0%,66%{transform:translateX(0)} 75%,100%{transform:translateX(376px)} }
    .float1 { animation: fl 6s ease-in-out infinite alternate; }
    .float2 { animation: fl 8s ease-in-out infinite alternate-reverse; }
    @keyframes fl { to { transform: translateY(-14px); } }
    .term1 { opacity:0; animation: tl 12s infinite; animation-delay: 0s; }
    .term2 { opacity:0; animation: tl 12s infinite; animation-delay: .9s; }
    .term3 { opacity:0; animation: tl 12s infinite; animation-delay: 1.8s; }
    .term4 { opacity:0; animation: tl 12s infinite; animation-delay: 2.7s; }
    @keyframes tl { 0%{opacity:0} 3%{opacity:1} 92%{opacity:1} 97%{opacity:0} 100%{opacity:0} }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; clip-path: none !important; } .l2,.l3{display:none} }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <g filter="url(#blur)">
      <circle class="blob1" cx="160" cy="260" r="110" fill="#14b8a6" fill-opacity="0.55"/>
      <circle class="blob2" cx="820" cy="40" r="130" fill="#7c3aed" fill-opacity="0.55"/>
      <circle class="blob3" cx="1000" cy="300" r="120" fill="#ec4899" fill-opacity="0.35"/>
    </g>

    <!-- left: text -->
    <g class="hello">
      <text x="60" y="80" font-size="20" fill="#9fb3d9" letter-spacing="1">Hola, soy <tspan class="pulse" fill="#5eead4">●</tspan></text>
    </g>
    <g class="name">
      <text x="58" y="148" font-size="72" font-weight="800" fill="url(#name)">Jostin Castillo</text>
    </g>

    <g class="mono" font-size="26" fill="#e2e8f0">
      <text x="60" y="206" fill="#5eead4">&gt;</text>
      <g class="l1"><g class="t1"><text x="92" y="206" textLength="484" lengthAdjust="spacing">Tecnología para contact centers</text></g><rect class="c1" x="92" y="184" width="3" height="28" fill="#5eead4"/></g>
      <g class="l2"><g class="t2"><text x="92" y="206" textLength="468" lengthAdjust="spacing">Automatización y agentes de IA</text></g><rect class="c2" x="92" y="184" width="3" height="28" fill="#5eead4"/></g>
      <g class="l3"><g class="t3"><text x="92" y="206" textLength="374" lengthAdjust="spacing">Desarrollador full-stack</text></g><rect class="c3" x="92" y="184" width="3" height="28" fill="#5eead4"/></g>
    </g>

    <g class="chips" font-size="15" fill="#cbd5e1">
      <rect x="60" y="248" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="126" y="270" text-anchor="middle">📍 Bogotá, CO</text>
      <rect x="204" y="248" width="116" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="262" y="270" text-anchor="middle">🎧 Wolkvox</text>
      <rect x="332" y="248" width="124" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="394" y="270" text-anchor="middle">🎬 Core Tech</text>
      <rect x="468" y="248" width="92" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="514" y="270" text-anchor="middle">ES · EN</text>
    </g>

    <!-- right: terminal card -->
    <g class="float1">
      <rect x="760" y="52" width="388" height="200" rx="14" fill="#0b1226" fill-opacity="0.88" stroke="#a78bfa" stroke-opacity="0.45"/>
      <circle cx="784" cy="76" r="6" fill="#f87171"/><circle cx="804" cy="76" r="6" fill="#fbbf24"/><circle cx="824" cy="76" r="6" fill="#34d399"/>
      <text class="mono" x="1128" y="80" text-anchor="end" font-size="12" fill="#64748b">~/jostincp</text>
      <line x1="760" y1="94" x2="1148" y2="94" stroke="#a78bfa" stroke-opacity="0.2"/>
      <g class="mono" font-size="16">
        <g class="term1"><text x="782" y="126" fill="#5eead4">$ <tspan fill="#e2e8f0">whoami</tspan></text></g>
        <g class="term2"><text x="782" y="154" fill="#a78bfa">creo · automatizo · aprendo</text></g>
        <g class="term3"><text x="782" y="190" fill="#5eead4">$ <tspan fill="#e2e8f0">stack --now</tspan></text></g>
        <g class="term4"><text x="782" y="218" fill="#f472b6">ts · python · n8n · ai-agents</text></g>
      </g>
    </g>
    <g class="float2 mono" font-size="34" fill-opacity="0.5" fill="#a78bfa"><text x="1120" y="290">{ }</text></g>
    <g class="float1 mono" font-size="30" fill-opacity="0.45" fill="#5eead4"><text x="700" y="290">&lt;/&gt;</text></g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
</svg>
