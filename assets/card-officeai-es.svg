<g class="f2"><polygon points="392,199 404.99,206.5 392,214 379.01,206.5" fill="#f7a3cf"/><polygon points="379.01,206.5 392,214 392,229 379.01,221.5" fill="#f472b6"/><polygon points="392,214 404.99,206.5 404.99,221.5 392,229" fill="#863e64"/><polyline points="379.01,206.5 392,214 404.99,206.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/><line x1="392" y1="214" x2="392" y2="229" stroke="#ffffff" stroke-opacity="0.2"/></g>
