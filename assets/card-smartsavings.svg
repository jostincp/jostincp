<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="SmartSavings - A WhatsApp bot that tracks expenses and savings, automated with n8n.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1228"/><stop offset="1" stop-color="#0a0e1f"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
<radialGradient id="rg"><stop offset="0" stop-color="#34d399" stop-opacity=".35"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".06"/></pattern>
<clipPath id="cl"><rect width="600" height="280" rx="18"/></clipPath>
</defs><style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono,.mono text{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace}
.run{animation:run 6s linear infinite}
@keyframes run{to{stroke-dashoffset:-1752}}
.f1{animation:f 4s ease-in-out infinite alternate}
.f2{animation:f 3s ease-in-out infinite alternate-reverse}
.f3{animation:f 5s ease-in-out infinite alternate}
@keyframes f{to{transform:translateY(-10px)}}
.sh{animation:sh 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes sh{to{transform:scale(.8);opacity:.5}}
.orb{animation:orb 8s linear infinite;transform-box:view-box;transform-origin:OX OY}
@keyframes orb{to{transform:rotate(360deg)}}
.pulse{animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{opacity:.3}}
.note{animation:note 4s ease-in infinite;opacity:0}
.n2{animation-delay:1.3s}.n3{animation-delay:2.6s}
@keyframes note{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}
.glow{animation:gl 5s ease-in-out infinite alternate}
@keyframes gl{to{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.note{opacity:1}}
</style>
<g clip-path="url(#cl)"><rect width="600" height="280" fill="url(#bg)"/><rect width="600" height="280" fill="url(#dots)"/>
<ellipse class="glow" cx="450" cy="140.0" rx="210" ry="160" fill="url(#rg)"/>
<text x="34" y="46" font-size="12.5" letter-spacing="2" fill="#34d399" class="mono">● PERSONAL FINANCE BOT</text>
<text x="34" y="96" font-size="34" font-weight="800" fill="#f1f5f9">SmartSavings</text>
<text x="34" y="134" font-size="16" fill="#94a3b8">A WhatsApp bot that tracks expenses</text>
<text x="34" y="158" font-size="16" fill="#94a3b8">and savings, automated with n8n.</text>
<rect x="34" y="206" width="45" height="26" rx="13" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/><text x="56" y="223.5" text-anchor="middle" font-size="12.5" fill="#66deb2" class="mono">n8n</text><rect x="86.8" y="206" width="83" height="26" rx="13" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/><text x="128" y="223.5" text-anchor="middle" font-size="12.5" fill="#66deb2" class="mono">WhatsApp</text><rect x="177.6" y="206" width="60" height="26" rx="13" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/><text x="208" y="223.5" text-anchor="middle" font-size="12.5" fill="#66deb2" class="mono">Astro</text>
<text x="34" y="258" font-size="12.5" fill="#64748b" class="mono">view repo →</text>
<ellipse class="sh" cx="480" cy="226" rx="62" ry="14" fill="#000" fill-opacity=".45"/>
<g class="f1"><polygon points="480,66 533.692,97.0 480,128 426.308,97.0" fill="#7be2bc"/><polygon points="426.308,97.0 480,128 480,190 426.308,159.0" fill="#34d399"/><polygon points="480,128 533.692,97.0 533.692,159.0 480,190" fill="#1c7454"/><polyline points="426.308,97.0 480,128 533.692,97.0" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/><line x1="480" y1="128" x2="480" y2="190" stroke="#ffffff" stroke-opacity="0.2"/><text transform="matrix(0.866 0.5 0 1 453.154 135.44)" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff" fill-opacity="0.92" class="mono">$</text></g>
<g class="f2"><polygon points="392,199 404.99,206.5 392,214 379.01,206.5" fill="#96f1e3"/><polygon points="379.01,206.5 392,214 392,229 379.01,221.5" fill="#5eead4"/><polygon points="392,214 404.99,206.5 404.99,221.5 392,229" fill="#338074"/><polyline points="379.01,206.5 392,214 404.99,206.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/><line x1="392" y1="214" x2="392" y2="229" stroke="#ffffff" stroke-opacity="0.2"/></g>
<g class="f3"><polygon points="556,49 567.258,55.5 556,62 544.742,55.5" fill="#95e7c9"/><polygon points="544.742,55.5 556,62 556,75 544.742,68.5" fill="#5cdbad"/><polygon points="556,62 567.258,55.5 567.258,68.5 556,75" fill="#32785f"/><polyline points="544.742,55.5 556,62 567.258,55.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/><line x1="556" y1="62" x2="556" y2="75" stroke="#ffffff" stroke-opacity="0.2"/></g></g>
<rect x="1" y="1" width="598" height="278" rx="17" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.5"/>
<rect class="run" x="1" y="1" width="598" height="278" rx="17" fill="none" stroke="url(#ac)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="220 1532"/>
</svg>